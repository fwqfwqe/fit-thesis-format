name: Portable tool checks

on:
  push:
    branches: [main]
    paths:
      - 'fit-thesis-format/**'
      - 'tests/**'
      - 'bootstrap.py'
      - 'requirements.txt'
      - '.github/workflows/portable-tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            fit-thesis-format/requirements.txt
            fit-thesis-format/requirements-render.txt
      - name: Install declared dependencies
        run: python -m pip install -r fit-thesis-format/requirements.txt -r fit-thesis-format/requirements-render.txt
      - name: Run portable regressions using synthetic documents
        run: python -m unittest discover -s tests -v
