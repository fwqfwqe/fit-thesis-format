interface:
  display_name: "福州理工学院论文格式修改"
  short_description: "按学校规范修改论文，统一奇偶页眉、编号、公式与引用，完整保留研究内容"
  default_prompt: "使用 $fit-thesis-format 按学校要求修改这份论文：完整审核全文，统一封面承诺书、四级标题与两级目录、奇偶页眉及连续页码、图表与无框可编辑公式、引用和作者写法，并把致谢放在最后；保留研究内容与原有对象，逐阶段核验并实际逐页检查，交付可编辑DOCX和真实检查说明。"
policy:
  allow_implicit_invocation: true
