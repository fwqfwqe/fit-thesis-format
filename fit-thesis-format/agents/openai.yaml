interface:
  display_name: "福州理工学院论文完整排版"
  short_description: "全文处理、内容保护、断点续做和Word/WPS双验收"
  default_prompt: "使用 $fit-thesis-format 按已确认的学院规范处理这份论文。通过统一任务入口完成全文语义确认、封面承诺书、标题目录、页眉页码、图表公式、引用及文后顺序；处理返回的语义和页面检查任务直到完成，保留研究内容与原有对象。对同一最终DOCX在Word和WPS分别导出并实际逐页检查，交付可编辑文件与真实修改说明。"
policy:
  allow_implicit_invocation: true
